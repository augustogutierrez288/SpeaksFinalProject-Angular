<section class="container-fluid">
    <section class="row">
        <p class="col-12 m-0">Cargar nuevos alumnos a la base de datos</p>
        <form [formGroup]="studentForm" (ngSubmit)="onSubmit.emit(studentForm.value)" class="col-12 d-flex flex-column align-items-start gap-1" action="">
            <div>
                <mat-form-field>
                    <mat-label>Nombre</mat-label>
                    <input formControlName="firstName" matInput />
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Apellido</mat-label>
                    <input formControlName="lastName" matInput/>
                </mat-form-field>
            </div>
            <div>
                <mat-form-field>
                    <mat-label>Email</mat-label>
                    <input type="email" formControlName="email" matInput/>
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Telefono</mat-label>
                    <input type="number" formControlName="phone" matInput/>
                </mat-form-field>
            </div>
            <div>
                <mat-form-field>
                    <mat-label>DNI</mat-label>
                    <input type="number" formControlName="dni" matInput/>
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Direccion</mat-label>
                    <input formControlName="address" matInput/>
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Ciudad</mat-label>
                    <input formControlName="city" matInput/>
                </mat-form-field>
            </div>
            <button mat-flat-button type="submit">
                <mat-icon>save</mat-icon>
                Guardar
            </button>
        </form>
    </section>
</section>
