<form action="">
    <mat-form-field class=" col-12">
        <mat-label>Email</mat-label>
        <input type="text" matInput placeholder="Ingresa tu email" name="email" required>    
    </mat-form-field>
    <mat-form-field class="col-12">
        <mat-label>Contraseña</mat-label>
        <input type="password" matInput placeholder="Ingresa tu contraseña" name="password" required>    
    </mat-form-field>
    <div class="col-12 d-flex justify-content-start">
        <button (click)="login()" mat-raised-button color="primary" type="button">Iniciar sesión</button>
        <button mat-raised-button color="primary" type="submit">Registrarme</button>
    </div>
</form>
